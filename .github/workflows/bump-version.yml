# Independent source-only bump. Never tag, release, build or dispatch Build.
name: Bump version

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Semantic version bump
        options:
          - patch
          - minor
          - major
        default: patch
        required: true

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: checkout selected source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: bump source and guarded nonforce branch push
        env:
          MODE: ${{ inputs.mode }}
          SELECTED_SHA: ${{ github.sha }}
          SELECTED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          python3 .github/scripts/bump.py "$MODE" --sha "$SELECTED_SHA" --ref "$SELECTED_REF"

      - name: summary
        run: echo "### Source version bumped. Run Build separately at the new branch SHA." >> "$GITHUB_STEP_SUMMARY"
